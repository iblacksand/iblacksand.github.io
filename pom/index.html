<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Pomodoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default Theme: Matcha */
            --bg-color: #e8f4ed;
            --fill-color: #b5e3d1;
            --text-color: #2c5e50;
            --fade-color: rgba(44, 94, 80, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Karla', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* The background progress bar */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: var(--fill-color);
            z-index: 0;
            transition: width 1s linear, background-color 0.5s ease;
        }

        /* Main UI Container */
        #ui-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            transition: opacity 1s ease, color 1s ease;
        }

        /* Typography */
        #timer-display {
            font-size: 15vw;
            font-weight: 300;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            user-select: none;
            transition: color 1s ease;
        }

        #status-display {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.8;
            transition: opacity 1s ease;
        }

        #cycle-display {
            font-size: 1rem;
            margin-top: -1rem;
            margin-bottom: 2rem;
            opacity: 0.6;
            transition: opacity 1s ease;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            opacity: 1;
            transition: opacity 1s ease, transform 1s ease;
        }

        button {
            font-family: 'Karla', sans-serif;
            background: none;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* Settings / Themes */
        #themes {
            position: absolute;
            bottom: 2rem;
            display: flex;
            gap: 1rem;
            opacity: 1;
            transition: opacity 1s ease;
        }

        .theme-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Top Right Utilities */
        #utils {
            position: absolute;
            top: 2rem;
            right: 2rem;
            opacity: 1;
            display: flex;
            gap: 0.5rem;
            transition: opacity 1s ease;
        }

        #utils button {
            border: none;
            font-size: 1.5rem;
            padding: 0.5rem;
        }

        #utils button:hover {
            background: none;
            opacity: 0.7;
            color: var(--text-color);
        }

        /* --- Settings Modal --- */
        #settings-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        #settings-modal.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-content {
            background: var(--bg-color);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            min-width: 300px;
            color: var(--text-color);
            transition: background 0.5s ease, color 0.5s ease;
        }

        .modal-content h2 {
            margin-bottom: 0.5rem;
            font-weight: 700;
            text-align: center;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
        }

        .input-group input {
            width: 70px;
            padding: 0.4rem;
            border: 1px solid var(--text-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-color);
            font-family: 'Karla', sans-serif;
            font-size: 1.1rem;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        /* --- Idle State (Minimal Mode) --- */
        body.idle #ui-container .controls,
        body.idle #ui-container #themes,
        body.idle #ui-container #status-display,
        body.idle #ui-container #cycle-display,
        body.idle #ui-container #utils {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
        }

        body.idle #ui-container #timer-display {
            color: var(--fade-color);
        }

        /* --- Fire TV / remote-control support --- */
        button:focus,
        input:focus,
        #timer-display:focus {
            outline: 4px solid var(--text-color);
            outline-offset: 6px;
        }

        button:focus {
            background: var(--text-color);
            color: var(--bg-color);
            transform: scale(1.06);
        }

        .theme-btn:focus {
            outline-offset: 5px;
            transform: scale(1.2);
        }

        #timer-display:focus {
            outline-offset: 14px;
            border-radius: 12px;
        }

        body.tv-mode {
            cursor: none;
        }

        body.tv-mode #ui-container {
            min-width: 100vw;
        }

        @media (min-width: 1600px) {
            #timer-display { font-size: 13vw; }
            #status-display { font-size: 2.5rem; }
            button { font-size: 1.25rem; padding: 0.7rem 1.8rem; }
            .theme-btn { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <div id="progress-bar"></div>

    <div id="ui-container">
        <div id="utils">
            <button id="settings-btn" title="Settings">⚙️</button>
            <button id="fullscreen-btn" title="Toggle Fullscreen">⛶</button>
        </div>
        
        <div id="status-display">Focus</div>
        <div id="cycle-display">Cycle 1/4</div>
        
        <div id="timer-display" tabindex="0" role="button" aria-label="Start or pause timer" title="Select to Start/Pause">25:00</div>
        
        <div class="controls">
            <button id="start-btn">Start</button>
            <button id="skip-btn">Skip</button>
            <button id="reset-btn">Reset</button>
        </div>

        <div id="themes">
            <button class="theme-btn" style="background-color: #b5e3d1;" onclick="setTheme('#e8f4ed', '#b5e3d1', '#2c5e50')" title="Matcha"></button>
            <button class="theme-btn" style="background-color: #b0c4de;" onclick="setTheme('#f0f4f8', '#b0c4de', '#2c3e50')" title="Twilight"></button>
            <button class="theme-btn" style="background-color: #d4a5d4;" onclick="setTheme('#faf0fa', '#d4a5d4', '#4a2c50')" title="Lavender"></button>
            <button class="theme-btn" style="background-color: #ffd8b1;" onclick="setTheme('#fff5eb', '#ffd8b1', '#5c3a21')" title="Peach"></button>
            <button class="theme-btn" style="background-color: #404040;" onclick="setTheme('#1a1a1a', '#404040', '#e0e0e0')" title="Dark Mode"></button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden">
        <div class="modal-content">
            <h2>Settings</h2>
            
            <div class="input-group">
                <label for="work-input">Focus (min)</label>
                <input type="number" id="work-input" min="1" max="120">
            </div>
            <div class="input-group">
                <label for="short-break-input">Short Break (min)</label>
                <input type="number" id="short-break-input" min="1" max="60">
            </div>
            <div class="input-group">
                <label for="long-break-input">Long Break (min)</label>
                <input type="number" id="long-break-input" min="1" max="60">
            </div>
            <div class="input-group">
                <label for="cycles-input">Cycles before Long</label>
                <input type="number" id="cycles-input" min="1" max="10">
            </div>

            <div class="modal-actions">
                <button id="cancel-settings">Cancel</button>
                <button id="save-settings" style="background: var(--text-color); color: var(--bg-color);">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- Settings & State (Now mutable) ---
        let workTime = 25 * 60;
        let shortBreakTime = 5 * 60;
        let longBreakTime = 15 * 60;
        let cyclesBeforeLong = 4;

        let timeLeft = workTime;
        let currentTotalTime = workTime;
        let isRunning = false;
        let currentMode = 'work'; // 'work', 'shortBreak', 'longBreak'
        let completedCycles = 0;
        let timerInterval = null;
        let isModalOpen = false;

        // --- DOM Elements ---
        const timerDisplay = document.getElementById('timer-display');
        const statusDisplay = document.getElementById('status-display');
        const cycleDisplay = document.getElementById('cycle-display');
        const progressBar = document.getElementById('progress-bar');
        const startBtn = document.getElementById('start-btn');
        const skipBtn = document.getElementById('skip-btn');
        const resetBtn = document.getElementById('reset-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        
        // Modal Elements
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const saveSettingsBtn = document.getElementById('save-settings');
        const cancelSettingsBtn = document.getElementById('cancel-settings');
        
        const workInput = document.getElementById('work-input');
        const shortBreakInput = document.getElementById('short-break-input');
        const longBreakInput = document.getElementById('long-break-input');
        const cyclesInput = document.getElementById('cycles-input');

        // --- Timer Logic ---
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            const progressPercent = ((currentTotalTime - timeLeft) / currentTotalTime) * 100;
            progressBar.style.width = `${progressPercent}%`;
            
            document.title = `${timerDisplay.textContent} - ${statusDisplay.textContent}`;
        }

        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'work') {
                currentTotalTime = workTime;
                statusDisplay.textContent = 'Focus';
            } else if (mode === 'shortBreak') {
                currentTotalTime = shortBreakTime;
                statusDisplay.textContent = 'Short Break';
            } else if (mode === 'longBreak') {
                currentTotalTime = longBreakTime;
                statusDisplay.textContent = 'Long Break';
            }
            timeLeft = currentTotalTime;
            cycleDisplay.textContent = `Cycle ${(completedCycles % cyclesBeforeLong) + 1}/${cyclesBeforeLong}`;
            updateDisplay();
        }

        function nextPhase() {
            if (currentMode === 'work') {
                completedCycles++;
                if (completedCycles > 0 && completedCycles % cyclesBeforeLong === 0) {
                    switchMode('longBreak');
                } else {
                    switchMode('shortBreak');
                }
            } else {
                switchMode('work');
            }
        }

        // Plays the embedded Airbus-style cabin announcement chime.
        function playChime() {
            const audio = document.getElementById('chime-audio');
            if (!audio) return;
            audio.currentTime = 0;
            audio.play().catch(err => console.warn('Unable to play chime:', err));
        }
        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                playChime();
                nextPhase();
                if ('Notification' in window && Notification.permission === 'granted') {
                    new Notification('Timer Complete', {
                        body: `Time for ${currentMode === 'work' ? 'focus' : 'a break'}!`,
                    });
                }
            }
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                startBtn.textContent = 'Start';
            } else {
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission();
                }
                timerInterval = setInterval(tick, 1000);
                startBtn.textContent = 'Pause';
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            if (isRunning) toggleTimer();
            completedCycles = 0;
            switchMode('work');
        }

        // --- Fire TV / remote-control support ---
        // Fire TV browsers generally expose the remote as keyboard events.
        // We keep a small, explicit focus order instead of relying on mouse hover.
        document.body.classList.add('tv-mode');

        const remoteFocusOrder = [
            timerDisplay,
            startBtn,
            skipBtn,
            resetBtn,
            ...document.querySelectorAll('.theme-btn'),
            settingsBtn,
            fullscreenBtn
        ];
        const modalFocusOrder = [
            workInput,
            shortBreakInput,
            longBreakInput,
            cyclesInput,
            cancelSettingsBtn,
            saveSettingsBtn
        ];
        let remoteFocusIndex = 0;

        function focusRemoteElement(index, wake = true) {
            if (!remoteFocusOrder.length) return;
            remoteFocusIndex = (index + remoteFocusOrder.length) % remoteFocusOrder.length;
            const element = remoteFocusOrder[remoteFocusIndex];
            if (wake) resetIdleTimer();
            element.focus({ preventScroll: true });
        }

        function focusFirstVisibleControl() {
            const visible = remoteFocusOrder.findIndex(el => {
                const style = getComputedStyle(el);
                return style.display !== 'none' && style.visibility !== 'hidden' && style.opacity !== '0';
            });
            focusRemoteElement(visible >= 0 ? visible : 0);
        }

        function enterFullscreen() {
            const request = document.documentElement.requestFullscreen ||
                document.documentElement.webkitRequestFullscreen;
            if (request && !document.fullscreenElement) {
                Promise.resolve(request.call(document.documentElement)).catch(() => {});
            }
        }

        function exitFullscreen() {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
                Promise.resolve(exit.call(document)).catch(() => {});
            }
        }

        function toggleFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                exitFullscreen();
            } else {
                enterFullscreen();
            }
            resetIdleTimer();
        }

        function handleRemoteKeydown(event) {
            const key = event.key;
            const isModal = isModalOpen;

            // Wake the interface whenever the remote is used.
            resetIdleTimer();

            // Fire TV remotes may report Enter, NumpadEnter, or Space for Select.
            if (key === 'Enter' || key === 'NumpadEnter' || key === ' ') {
                event.preventDefault();
                const active = document.activeElement;
                if (active && typeof active.click === 'function') {
                    active.click();
                } else {
                    toggleTimer();
                }
                return;
            }

            if (key === 'Escape' || key === 'BrowserBack' || key === 'GoBack') {
                event.preventDefault();
                if (isModal) {
                    settingsModal.classList.add('hidden');
                    isModalOpen = false;
                    focusRemoteElement(remoteFocusOrder.indexOf(settingsBtn));
                } else if (document.fullscreenElement || document.webkitFullscreenElement) {
                    exitFullscreen();
                } else {
                    focusRemoteElement(1);
                }
                return;
            }

            // Navigate Settings explicitly because a TV remote does not have
            // a convenient Tab key. Up/Down moves between fields; Left/Right
            // moves between the Cancel and Save actions.
            if (isModal) {
                const modalIndex = modalFocusOrder.indexOf(document.activeElement);
                if (modalIndex >= 0 && (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight')) {
                    event.preventDefault();
                    let nextModal = modalIndex;
                    if (key === 'ArrowUp') nextModal = modalIndex <= 0 ? 0 : modalIndex - 1;
                    if (key === 'ArrowDown') nextModal = modalIndex >= 3 ? (modalIndex === 3 ? 4 : 5) : modalIndex + 1;
                    if (key === 'ArrowLeft' && modalIndex >= 4) nextModal = 4;
                    if (key === 'ArrowRight' && modalIndex >= 4) nextModal = 5;
                    modalFocusOrder[nextModal].focus({ preventScroll: true });
                    return;
                }
                return;
            }

            const current = document.activeElement;
            let next = remoteFocusIndex;

            if (key === 'ArrowRight' || key === 'ArrowDown') {
                event.preventDefault();
                next++;
            } else if (key === 'ArrowLeft' || key === 'ArrowUp') {
                event.preventDefault();
                next--;
            } else {
                return;
            }

            // If the timer itself is focused, Down goes to Start; otherwise
            // left/right/up/down simply traverse the TV-friendly focus order.
            if (current === timerDisplay && (key === 'ArrowRight' || key === 'ArrowDown')) {
                next = 1;
            }
            focusRemoteElement(next);
        }

        document.addEventListener('keydown', handleRemoteKeydown, true);

        remoteFocusOrder.forEach((element, index) => {
            element.addEventListener('focus', () => {
                remoteFocusIndex = index;
                resetIdleTimer();
            });
        });

        // Clicking the fullscreen control still works with a mouse/browser.
        // Remote Select uses the same function.
        
        // --- Event Listeners ---
        startBtn.addEventListener('click', toggleTimer);
        timerDisplay.addEventListener('click', toggleTimer);
        
        skipBtn.addEventListener('click', () => {
            if (isRunning) toggleTimer();
            nextPhase();
        });

        resetBtn.addEventListener('click', resetTimer);

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // --- Settings Modal Logic ---
        settingsBtn.addEventListener('click', () => {
            // Populate inputs with current settings (converted to minutes)
            workInput.value = workTime / 60;
            shortBreakInput.value = shortBreakTime / 60;
            longBreakInput.value = longBreakTime / 60;
            cyclesInput.value = cyclesBeforeLong;
            
            settingsModal.classList.remove('hidden');
            isModalOpen = true;
            resetIdleTimer(); // Wake up UI
            workInput.focus({ preventScroll: true });
        });

        cancelSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
            isModalOpen = false;
            focusRemoteElement(remoteFocusOrder.indexOf(settingsBtn));
        });

        saveSettingsBtn.addEventListener('click', () => {
            // Parse and apply new values
            workTime = Math.max(1, parseInt(workInput.value)) * 60;
            shortBreakTime = Math.max(1, parseInt(shortBreakInput.value)) * 60;
            longBreakTime = Math.max(1, parseInt(longBreakInput.value)) * 60;
            cyclesBeforeLong = Math.max(1, parseInt(cyclesInput.value));
            
            settingsModal.classList.add('hidden');
            isModalOpen = false;
            
            resetTimer(); // Apply cleanly
            focusRemoteElement(remoteFocusOrder.indexOf(settingsBtn));
        });

        // Close modal if clicking outside the modal box
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.add('hidden');
                isModalOpen = false;
                focusRemoteElement(remoteFocusOrder.indexOf(settingsBtn));
            }
        });

        // --- Theming ---
        function setTheme(bg, fill, text) {
            const root = document.documentElement;
            root.style.setProperty('--bg-color', bg);
            root.style.setProperty('--fill-color', fill);
            root.style.setProperty('--text-color', text);
            root.style.setProperty('--fade-color', `${text}33`);
        }

        // --- Minimalist Idle Fade Logic ---
        let idleTimeout;
        const IDLE_TIME = 3000;

        function resetIdleTimer() {
            document.body.classList.remove('idle');
            clearTimeout(idleTimeout);
            
            // Only fade out during work sessions, while running, and if the modal is CLOSED
            if (currentMode === 'work' && isRunning && !isModalOpen) {
                idleTimeout = setTimeout(() => {
                    document.body.classList.add('idle');
                }, IDLE_TIME);
            }
        }

        document.addEventListener('mousemove', resetIdleTimer);
        document.addEventListener('keydown', resetIdleTimer);
        document.addEventListener('click', resetIdleTimer);

        setInterval(() => {
            if (currentMode !== 'work' || !isRunning || isModalOpen) {
                document.body.classList.remove('idle');
                clearTimeout(idleTimeout);
            }
        }, 1000);

        // Initialize display
        updateDisplay();
        // Give the remote an initial target. Fullscreen APIs generally require
        // a user gesture, so the Select/Fullscreen button performs the request.
        setTimeout(() => focusRemoteElement(0, false), 0);
    </script>
